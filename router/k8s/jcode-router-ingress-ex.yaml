apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jcode-router-ingress
  namespace: watcher
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/enable-websockets: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      # code-server bootstraps the workbench with inline scripts.
      more_set_headers "Content-Security-Policy: default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; form-action 'self'; upgrade-insecure-requests";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jcode.example.com
      secretName: jcode-router-tls
  rules:
    - host: jcode.example.com
      http:
        paths:
          - path: /jcode
            pathType: Prefix
            backend:
              service:
                name: jcode-router-svc
                port:
                  number: 3001
          - path: /jcode-logout
            pathType: Prefix
            backend:
              service:
                name: jcode-router-svc
                port:
                  number: 3001
          - path: /websockify
            pathType: Prefix
            backend:
              service:
                name: jcode-router-svc
                port:
                  number: 3001
