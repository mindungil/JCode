apiVersion: v1
kind: ConfigMap
metadata:
  name: jcode-generator-configmap
  namespace: watcher
data:
  ALGORITHM: "HS256"
  NFS_SERVER: "your.nfs.server.address"
  NFS_PATH: "/yourPath"
  SNAPSHOT_NFS_SERVER: "your.nfs.snapshot.server.address"
  SNAPSHOT_NFS_PATH: "/yourSnapshotPath"
  SERVICE_ACCOUNT: "jcode-workload"
  CODE_SERVER_IMAGE: "harbor.example.com/jcode/code-server:0123456789abcdef"
  CODE_SERVER_VNC_IMAGE: "harbor.example.com/jcode/code-server-vnc:0123456789abcdef"
  IMAGE_PULL_POLICY: "IfNotPresent"
  IMAGE_PULL_SECRET_NAMES: "harbor-jcode-pull"
  CODE_SERVER_ARGS: "--restrict-workspace-root /home/coder/project /home/coder/project"
  CODE_SERVER_VNC_ARGS: "--restrict-workspace-root /home/coder/project /home/coder/project"
  WORKSPACE_ROOT: "/home/coder/project"
  GENERATOR_SA_NAME: "jcode-workspace"
  GENERATOR_SA_NAMESPACE: "watcher"
  WATCHER_NAMESPACE: "watcher"
  STARTER_ZIP_MAX_BYTES: "52428800"
  STARTER_ZIP_MAX_UNCOMPRESSED_BYTES: "209715200"
  STARTER_ZIP_MAX_FILES: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: jcode-generator-secret
  namespace: watcher
type: Opaque
data:
  GENERATOR_SERVICE_SECRET: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" # 32-byte example; replace through Secret manager
